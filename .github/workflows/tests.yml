name: Tests

# Jusqu'ici, le seul workflow du dépôt construisait et publiait l'image sans
# jamais exécuter un test : une régression comptable pouvait atteindre le
# registre, puis les établissements, sans que rien ne la signale.
#
# La suite est désormais au vert et build-image.yml l'appelle avant de
# publier : une image dont les tests échouent n'atteint plus le registre.
on:
  # Pas de déclencheur « push » : pousser une branche dont la demande de
  # fusion est déjà ouverte lançait deux fois la même suite sur le même
  # commit. La demande de fusion couvre l'avant-fusion, build-image.yml
  # couvre main.
  pull_request:
  workflow_call:      # appelé par build-image.yml, qui refuse de publier si ceci échoue
  workflow_dispatch:

# Trois poussées d'affilée n'ont qu'un dernier état utile : les précédentes
# sont abandonnées au lieu de faire la queue. Jamais sur main, où la
# publication d'image ne doit pas pouvoir être interrompue.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pest:
    name: Suite Pest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # Même version que l'image de production (php:8.4-fpm) : tester
          # sur une autre reviendrait à valider un environnement que
          # personne n'exécute.
          php-version: '8.4'
          extensions: gd, zip
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # La suite tourne sur SQLite en mémoire (voir phpunit.xml) : aucun
      # service de base de données n'est nécessaire, et aucune base réelle
      # ne peut être touchée.
      - name: Run tests
        run: php artisan test
