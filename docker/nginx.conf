# ─────────────────────────────────────────────────────────────────────────────
# HotelixOS — Configuration Nginx du template établissement
# Emplacement cible : /etc/nginx/sites-available/default
#
# Config nginx minimaliste pour une app Laravel :
#   - try_files vers index.php (front controller)
#   - cache des assets statiques
#   - blocage des fichiers sensibles (.env, composer.json, artisan...)
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen      80 default_server;
    listen      [::]:80 default_server;

    server_name _;
    root        /var/www/html/public;
    index       index.php index.html;

    charset     utf-8;

    # Taille max des uploads (logo, imports...)
    client_max_body_size 20M;

    # ── Logs ────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # ── Blocage des fichiers sensibles ──────────────────────────────────────
    # Fichiers cachés (.env, .git, .htaccess...)
    location ~ /\.(?!well-known).* {
        deny all;
    }
    # Manifestes et scripts applicatifs non destinés au public
    location ~ (?:composer\.(?:json|lock)|package(?:-lock)?\.json|artisan|\.md$) {
        deny all;
    }

    # ── Point d'entrée Laravel (front controller) ───────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── Assets statiques (cache longue durée) ───────────────────────────────
    # Repli vers Laravel plutôt que =404 : certaines ressources portant une
    # extension d'image sont générées à la volée (icônes PWA dérivées du logo
    # de l'établissement) et n'existent pas sur le disque. Avec =404, nginx les
    # bloquait avant même d'atteindre PHP.
    location ~* \.(js|css|png|jpe?g|gif|ico|svg|webp|avif|woff2?|ttf|eot|map)$ {
        try_files $uri /index.php?$query_string;
        expires                 30d;
        access_log              off;
        add_header Cache-Control "public, immutable";
    }

    # ── PHP via FastCGI (php-fpm sur 127.0.0.1:9000) ────────────────────────
    location ~ \.php$ {
        fastcgi_pass   127.0.0.1:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include        fastcgi_params;
        fastcgi_hide_header X-Powered-By;

        # Restaure le port dans HTTP_HOST : les versions récentes de nginx
        # forcent HTTP_HOST à $host (sans port) par défaut pour cette
        # config incluse, ce qui casse la génération d'URL de Laravel dès
        # que le port externe (mappé par Docker) diffère du port interne
        # d'écoute de nginx (toujours 80 ici).
        fastcgi_param  HTTP_HOST $http_host;

        # Timeouts étendus pour le provisioning en SSE (10 minutes)
        fastcgi_connect_timeout 60s;
        fastcgi_read_timeout    600s;
        fastcgi_send_timeout    600s;
    }

    # /favicon.ico est servi par Laravel (icône composée depuis le logo de
    # l'établissement) : sans try_files, ce bloc renverrait 404 au lieu de
    # passer la main au front controller.
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        try_files $uri /index.php?$query_string;
    }
    location = /robots.txt  { access_log off; log_not_found off; }
}
